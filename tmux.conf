# prevent tmux from running a login shell
set -g default-command "${SHELL}"

# long history
set-option -g history-limit 30000

# reduce the escape key delay so escape is interpreted quickly by programs in windows (notably vi)
set -sg escape-time 30

# vi navigation in buffer mode
setw -g mode-keys vi

# colours
set -g default-terminal "screen-256color"
set-option -sa terminal-overrides ",xterm-256color:RGB"

# Based on gruvbox dark theme
col_bg="#282828"
col_bg0_h="#1d2021"
col_bg0="#282828"
col_bg1="#3c3836"
col_bg2="#504945"
col_bg3="#665c54"
col_bg4="#7c6f64"
col_gray0="#a89984"
col_gray1="#928374"
col_gray2="#928374"
col_bg0_s="#32302f"
col_fg="#ebdbb2"
col_fg4="#a89984"
col_fg3="#bdae93"
col_fg2="#d5c4a1"
col_fg1="#ebdbb2"
col_fg0="#fbf1c7"

col_red="#cc241d"
col_red2="#fb4934"
col_green="#98971a"
col_green2="#b8bb26"
col_yellow="#d79921"
col_yellow2="#fabd2f"
col_blue="#458588"
col_blue2="#83a598"
col_purple="#b16286"
col_purple2="#d3869b"
col_aqua="#689d6a"
col_aqua2="#8ec07c"
col_orange="#d65d0e"
col_orange2="#fe8019"

# status bar
set -g status-style "bg=#{col_bg1}"
set -ag status-style "fg=#{col_fg3}"
set -g status-right-length 50
set -g status-right '#{host_short} %a %Y-%m-%d %H:%M:%S %Z'
setw -g window-status-current-format "#[fg=#{col_fg1},bold]#[bg=#{col_bg2}] #I:#W* "

# mouse support
set -g mouse on

# reload config
unbind-key r
bind r source-file ~/.tmux.conf

# copy mode
unbind-key C-space
bind C-space copy-mode

# paste
unbind-key p
bind p paste-buffer -p # the -p inserts escape characters for bracketed-paste

# Do not exit from copy-mode when selecting text.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection -x

# toggle zoom
unbind-key space
bind space resize-pane -Z

# list sessions
bind S choose-tree -s

# splits that put the new window on the other side
unbind-key H
unbind-key J
unbind-key K
unbind-key L
bind H split-window -h -b
bind K split-window -v -b
bind J split-window -v
bind L split-window -h

# use vi keys to navigate between windows
unbind-key h
unbind-key j
unbind-key k
unbind-key l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# use vi keys to resize windows
unbind-key C-h
unbind-key C-j
unbind-key C-k
unbind-key C-l
bind -r C-h resize-pane -L 10
bind -r C-j resize-pane -D 10
bind -r C-k resize-pane -U 10
bind -r C-l resize-pane -R 10

# rotate windows
unbind-key C-u
unbind-key C-i
bind -r C-u rotate-window -U
bind -r C-i rotate-window -D
